<g class="icn" style="--i:2" transform="translate(332.6 375.8) scale(1.833)" fill="none" stroke="#0f8f86" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20.5V9l8-5 8 5v11.5"/><path d="M9.5 20.5v-5.5h5v5.5M2.5 20.5h19"/><circle cx="12" cy="10" r="1.6"/></g>
<g class="icn" style="--i:3" transform="translate(103.4 375.8) scale(1.833)" fill="none" stroke="#2f6fde" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9.5 12 4l9.5 5.5Z"/><path d="M5 10v8M9.7 10v8M14.3 10v8M19 10v8M3 20.5h18"/></g>
<g class="icn" style="--i:4" transform="translate(32.5 157.7) scale(1.833)" fill="none" stroke="#6a45c9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7.5" r="3.5"/><path d="M2.5 20.5v-.8a6.5 6.5 0 0 1 13 0v.8"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16.8 14.2a4.8 4.8 0 0 1 4.7 4.8v1.5"/></g>
</g>

<!-- connectors: lines draw themselves, then end dots, pulses and travelling sparks -->
<g fill="none" stroke-width="3" stroke-linecap="round">
<path class="line" style="--i:0" stroke="#4c9a22" pathLength="1" d="M640 356 L640 408"/>
<path class="line" style="--i:1" stroke="#6a45c9" pathLength="1" d="M384 536 L422 561"/>
<path class="line" style="--i:2" stroke="#c82a5c" pathLength="1" d="M896 536 L858 561"/>
<path class="line" style="--i:3" stroke="#2f6fde" pathLength="1" d="M384 796 L439 756"/>
<path class="line" style="--i:4" stroke="#0f8f86" pathLength="1" d="M896 796 L841 756"/>
</g>
<g>
<circle class="dot" style="--i:0" cx="640" cy="356" r="7" fill="#4c9a22"/><circle class="dot-end" style="--i:0" cx="640" cy="408" r="7" fill="#4c9a22"/>
<circle class="dot" style="--i:1" cx="384" cy="536" r="7" fill="#6a45c9"/><circle class="dot-end" style="--i:1" cx="422" cy="561" r="7" fill="#6a45c9"/>
<circle class="dot" style="--i:2" cx="896" cy="536" r="7" fill="#c82a5c"/><circle class="dot-end" style="--i:2" cx="858" cy="561" r="7" fill="#c82a5c"/>
<circle class="dot" style="--i:3" cx="384" cy="796" r="7" fill="#2f6fde"/><circle class="dot-end" style="--i:3" cx="439" cy="756" r="7" fill="#2f6fde"/>
<circle class="dot" style="--i:4" cx="896" cy="796" r="7" fill="#0f8f86"/><circle class="dot-end" style="--i:4" cx="841" cy="756" r="7" fill="#0f8f86"/>
</g>
<g fill="none" stroke-width="2">
<circle class="ping" style="--i:0" cx="640" cy="408" r="7" stroke="#4c9a22"/>
<circle class="ping" style="--i:1" cx="422" cy="561" r="7" stroke="#6a45c9"/>
<circle class="ping" style="--i:2" cx="858" cy="561" r="7" stroke="#c82a5c"/>
<circle class="ping" style="--i:3" cx="439" cy="756" r="7" stroke="#2f6fde"/>
<circle class="ping" style="--i:4" cx="841" cy="756" r="7" stroke="#0f8f86"/>
</g>
<g class="spark" stroke="#ffffff" stroke-width="2">
<circle r="4.5" fill="#4c9a22"><animateMotion dur="2.6s" begin="2.4s" repeatCount="indefinite" path="M640 408 L640 356"/></circle>
<circle r="4.5" fill="#6a45c9"><animateMotion dur="2.6s" begin="2.7s" repeatCount="indefinite" path="M422 561 L384 536"/></circle>
<circle r="4.5" fill="#c82a5c"><animateMotion dur="2.6s" begin="3.0s" repeatCount="indefinite" path="M858 561 L896 536"/></circle>
<circle r="4.5" fill="#2f6fde"><animateMotion dur="2.6s" begin="3.3s" repeatCount="indefinite" path="M439 756 L384 796"/></circle>
<circle r="4.5" fill="#0f8f86"><animateMotion dur="2.6s" begin="3.6s" repeatCount="indefinite" path="M841 756 L896 796"/></circle>
</g>

<!-- centre: the child -->
<g class="medal" filter="url(#sh-medal)">
<circle cx="640" cy="640" r="148" fill="#fdf3e6"/>
<g clip-path="url(#clip-circle)">
<image href="approach-child.webp" xlink:href="approach-child.webp" x="492" y="474" width="296" height="266" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-bowl)"/>
</g>
<circle cx="640" cy="640" r="150" fill="none" stroke="#ffffff" stroke-width="4"/>
<circle cx="640" cy="640" r="153" fill="none" stroke="#f6c28b" stroke-width="2"/>
<text x="640" y="733" text-anchor="middle" font-size="30" font-weight="800" fill="#1b2b5b">The Child</text>
<text x="640" y="760" text-anchor="middle" font-size="21" fill="#1b2b5b">at the Centre</text>
<path d="M590 776 Q640 770 690 774" fill="none" stroke="#ff8400" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- heading and intro -->
<text x="640" y="116" text-anchor="middle" font-size="56" fill="#ff8400">Our Approach</text>
<text text-anchor="middle" font-size="16" fill="#000000"><tspan x="640" y="172">Inclusive education at scale requires coordinated action across classrooms, families, professional support systems and public</tspan><tspan x="640" y="196">institutions. Project Inclusion brings these stakeholders together through teacher capacity building, early identification,</tspan><tspan x="640" y="220">intervention support and institutional partnerships.</tspan></text>

<!-- stakeholder cards -->
<g class="card" style="--i:0" filter="url(#sh-green)">
<rect x="441" y="253" width="398" height="102" rx="51" fill="url(#g-green)" stroke="#b9de9a" stroke-width="2"/>
<circle cx="497" cy="304" r="32" fill="#4c9a22"/>
