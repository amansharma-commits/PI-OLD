<path class="seg" style="--i:0" d="M113.6 45.4 A232 232 0 0 1 366.4 45.4 L326.1 107.5 A158 158 0 0 0 153.9 107.5 Z" fill="#d9efc4"/>
<path class="seg" style="--i:1" d="M386.0 59.7 A232 232 0 0 1 464.1 300.0 L392.6 280.9 A158 158 0 0 0 339.4 117.2 Z" fill="#fbd5e0"/>
<path class="seg" style="--i:2" d="M456.6 323.1 A232 232 0 0 1 252.1 471.7 L248.3 397.8 A158 158 0 0 0 387.5 296.6 Z" fill="#c8eeea"/>
