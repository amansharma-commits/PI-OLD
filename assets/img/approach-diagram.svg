<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="ad-title ad-desc" font-family="Mulish, system-ui, sans-serif">
<title id="ad-title">Our Approach: the child at the centre</title>
<desc id="ad-desc">Five stakeholder groups surround the child at the centre: teachers and special educators, parents and families, professionals such as therapists, state government and the education system, and institutions such as DEPwD, RCI and KVS.</desc>
<style>
@import url("https://fonts.googleapis.com/css2?family=Mulish:wght@400;700;800&amp;display=swap");

/* ---- entrance: ring, icons, medallion, cards, connectors ---- */
.seg    { transform-box: fill-box; transform-origin: center; animation: segIn .8s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * .12s); }
.icn    { animation: fadeIn .6s ease both; animation-delay: calc(.55s + var(--i) * .12s); }
.medal  { transform-box: fill-box; transform-origin: center; animation: medalIn .9s cubic-bezier(.2,.8,.2,1) both; animation-delay: .2s; }
.card   { animation: cardIn .8s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(.9s + var(--i) * .14s); }
.line   { animation: draw .7s ease-in-out both; animation-delay: calc(1.15s + var(--i) * .14s); }
.dot    { animation: fadeIn .4s ease both; animation-delay: calc(1.15s + var(--i) * .14s); }
.dot-end{ animation: fadeIn .4s ease both; animation-delay: calc(1.7s + var(--i) * .14s); }

/* ---- always-on: soft breathing glow, pulsing dots, travelling sparks ---- */
.halo   { transform-box: fill-box; transform-origin: center; animation: breathe 6s ease-in-out infinite; }
.ping   { transform-box: fill-box; transform-origin: center; animation: ping 2.6s ease-out infinite; animation-delay: calc(2.2s + var(--i) * .35s); }

@keyframes segIn   { from { opacity: 0; transform: scale(.82); } }
@keyframes fadeIn  { from { opacity: 0; } }
@keyframes medalIn { from { opacity: 0; transform: scale(.78); } }
@keyframes cardIn  { from { opacity: 0; transform: translateY(20px); } }
@keyframes draw    { from { stroke-dasharray: 1; stroke-dashoffset: 1; } to { stroke-dasharray: 1; stroke-dashoffset: 0; } }
@keyframes breathe { 0%, 100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
@keyframes ping    { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(2.8); } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .spark { display: none; }
}
</style>
<defs>
<linearGradient id="g-green"  x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e8f5df"/></linearGradient>
<linearGradient id="g-purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#efeafc"/></linearGradient>
<linearGradient id="g-pink"   x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fde8ef"/></linearGradient>
<linearGradient id="g-blue"   x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e8f0fd"/></linearGradient>
<linearGradient id="g-teal"   x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e0f4f1"/></linearGradient>
<radialGradient id="g-halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ff963c" stop-opacity=".20"/><stop offset=".45" stop-color="#ff963c" stop-opacity=".08"/><stop offset=".72" stop-color="#ff963c" stop-opacity="0"/></radialGradient>
<filter id="sh-green"  x="-15%" y="-30%" width="130%" height="190%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#4c9a22" flood-opacity=".30"/></filter>
<filter id="sh-purple" x="-15%" y="-30%" width="130%" height="190%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#6a45c9" flood-opacity=".30"/></filter>
<filter id="sh-pink"   x="-15%" y="-30%" width="130%" height="190%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#c82a5c" flood-opacity=".30"/></filter>
<filter id="sh-blue"   x="-15%" y="-30%" width="130%" height="190%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#2f6fde" flood-opacity=".30"/></filter>
<filter id="sh-teal"   x="-15%" y="-30%" width="130%" height="190%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0f8f86" flood-opacity=".30"/></filter>
<filter id="sh-medal"  x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#ff8400" flood-opacity=".35"/></filter>
<clipPath id="clip-circle"><circle cx="640" cy="640" r="148"/></clipPath>
<clipPath id="clip-bowl"><path d="M492 492 H788 V658 A148 39 0 0 1 640 697 A148 39 0 0 1 492 658 Z"/></clipPath>
</defs>

<!-- section panel -->
<rect width="1280" height="960" rx="48" fill="#f1f2f2"/>

<!-- soft peach glow behind the ring -->
<circle class="halo" cx="640" cy="640" r="310" fill="url(#g-halo)"/>

