<g class="icn" style="--i:0" transform="translate(218 23) scale(1.833)" fill="none" stroke="#4c9a22" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 9.5 12 4.5 2 9.5l10 5 10-5Z"/><path d="M6 11.5v4.8c3.2 2.3 8.8 2.3 12 0v-4.8"/></g>
